{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-icon">{{ icon('user') }}</div>
    <h2 class="auth-header">Create an account</h2>
    <p class="auth-sub">Choose your role to get started</p>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
            <label>Role</label>
            <div class="role-picker">
                <input type="radio" id="role-patient" name="role" value="Patient" checked>
                <label for="role-patient" class="role-option">{{ icon('heart') }} Patient</label>

                <input type="radio" id="role-doctor" name="role" value="Doctor">
                <label for="role-doctor" class="role-option">{{ icon('stethoscope') }} Doctor</label>

                <input type="radio" id="role-admin" name="role" value="Admin">
                <label for="role-admin" class="role-option">{{ icon('crown') }} Admin</label>
            </div>
        </div>
        <button type="submit" class="btn">Create account</button>
    </form>
    <p class="auth-footer">
        Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
</div>
{% endblock %}
